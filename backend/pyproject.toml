[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmaster"
version = "0.1.0"
description = "Multi-identity AI chat agent with RAG knowledge bases."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-qdrant>=0.1",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.12",
    "docx2txt>=0.1",
    "pypdf>=5.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
chatmaster-ingest = "chatmaster.cli.ingest:app"
chatmaster-rebuild-index = "chatmaster.cli.rebuild_index:app"
chatmaster-cleanup-indexes = "chatmaster.cli.cleanup_indexes:app"
chatmaster-import-legacy-providers = "chatmaster.cli.import_legacy_providers:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["chatmaster*"]

[tool.setuptools.package-data]
"chatmaster.identities" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# FastAPI's compatibility wrapper currently emits this upstream warning for
# every TestClient import; keep test output focused until the upstream API is
# replaced.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
